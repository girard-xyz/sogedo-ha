<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B63CE"/>
      <stop offset="1" stop-color="#063D82"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6F1FF"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.5" stop-color="#9CC4F5" stop-opacity="0"/>
      <stop offset="1" stop-color="#9CC4F5" stop-opacity="0.45"/>
    </linearGradient>
    <clipPath id="dropClip">
      <path d="M256 92C302 154 362 220 362 298A106 106 0 0 1 150 298C150 220 210 154 256 92Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- water drop -->
  <path d="M256 92C302 154 362 220 362 298A106 106 0 0 1 150 298C150 220 210 154 256 92Z" fill="url(#drop)"/>
  <g clip-path="url(#dropClip)">
    <rect x="256" y="92" width="106" height="312" fill="url(#shade)"/>
  </g>

  <!-- meter counter window -->
  <rect x="186" y="274" width="140" height="68" rx="16" fill="#062B57"/>
  <rect x="186" y="274" width="140" height="68" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2"/>
  <text x="256" y="324" text-anchor="middle" font-family="DejaVu Sans, Verdana, sans-serif" font-size="42" font-weight="700" fill="#FFFFFF">0123</text>
</svg>
